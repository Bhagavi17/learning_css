<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation_text</title>
    <style>
        .text-container{
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:sans-serif;
            letter-spacing: 4px;
            font-size:80px;
            font-weight:800;
            perspective: 100px;
        }
        .text-container > b {
            height:100px;
            box-shadow: 0px 10px 5px grey;
            /* background-color:darkred ; */
            background:linear-gradient(to right,darkorange ,white,green);
            /* background-clip */
            background-clip:text;
            color:transparent;
            transform-origin: bottom ;
            animation:getUpDown 5s infinite;
            display:inline-block;
        }
        .text-container>b:nth-child(1){animation-delay:0s;}
        .text-container>b:nth-child(2){animation-delay:0.25s;}
        .text-container>b:nth-child(3){animation-delay:0.50s;}
        .text-container>b:nth-child(4){animation-delay:0.75s;}
        .text-container>b:nth-child(5){animation-delay:1s;}
        .text-container>b:nth-child(6){animation-delay:1.25s;}
        .text-container>b:nth-child(7){animation-delay:1.5s;}

        @keyframes getUpDown{
            from{transform:rotateX(-85deg);}
            10%,50% {transform:rotateX(0);}
            60%,to{transform:rotateX(-85deg);}
        }

    </style>
</head>
<body>
    <div class="text-container">
        <b>B</b><b>H</b><b>A</b><b>G</b><b>A</b><b>V</b><b>I</b>
    </div>
</body>
</html>
