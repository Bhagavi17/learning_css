<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nth_child</title>
<style>
    .ul_items{
        width:250px;
        padding:10px;
        list-style-type:none;
        font-weight: 700;
    }
    li{

        padding:10px;
        border:2px solid darkred;
        margin-bottom:5px;
        border-radius:10px;
        align-content: center;
        text-align:center;
       

    }
    li:nth-child(even){
        background-color: blue;
    
    }
    li:nth-child(odd){
         background-color: yellow;
    }

</style>
</head>
<body>
   <!-- ul>li*8{item$} -->
    <ul class="ul_items">
        <li>item1</li>
        <li>item2</li>
        <li>item3</li>
        <li>item4</li>
        <li>item5</li>
        <li>item6</li>
        <li>item7</li>
        <li>item8</li>
    </ul>
    
</body>
</html>
